[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pychain"
version = "0.1.0"
description = "Markov Chain Monte Carlo (MCMC) sampling using the Metropolis-Hastings algorithm."
authors = [
    { name = "Irshad Mohammed", email = "creativeishu@gmail.com" },
    { name = "Janu Verma", email = "j.verma5@gmail.com" },
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "corner>=2.2",
]
keywords = ["MCMC", "Metropolis-Hastings", "Sampling", "Markov Chain", "Monte-Carlo", "Bayesian"]

[project.urls]
Homepage = "https://github.com/creativeishu/pychain"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pychain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pychain"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
